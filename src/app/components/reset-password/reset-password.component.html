<div class="reset-page">
  <div class="reset-container">
    <h2><i class="fas fa-key me-2"></i> Reset Password</h2>

    <form (ngSubmit)="onSubmit()">
      <input type="password" name="new_password" [(ngModel)]="newPassword" placeholder="Enter new password" required />
      <input type="password" name="confirm_password" [(ngModel)]="confirmPassword" placeholder="Confirm new password" required />
      <button type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Reset Password</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin me-2"></i> Updating...</span>
      </button>
    </form>

    <a routerLink="/login" id="backtologin"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>

    <div *ngIf="message" [ngClass]="isSuccess ? 'alert alert-success mt-3' : 'alert alert-danger mt-3'" style="font-size: 13px;">
      {{ message }}
    </div>
  </div>
</div>
