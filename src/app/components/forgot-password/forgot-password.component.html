<div class="forgot-page">
  <div class="forgot-container">
    <h2><i class="fas fa-lock-open me-2"></i> Forgot Password</h2>

    <form (ngSubmit)="onSubmit()">
      <input type="email" name="email" [(ngModel)]="email" placeholder="Enter your registered email" required />
      <button type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Send Reset Link</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin me-2"></i> Sending...</span>
      </button>
    </form>

    <a routerLink="/login" id="backtologin"><i class="fas fa-arrow-left me-1"></i> Back to Login</a>

    <div *ngIf="message" [ngClass]="isSuccess ? 'alert alert-success mt-3' : 'alert alert-danger mt-3'" style="font-size: 13px;">
      {{ message }}
      <div *ngIf="resetUrl" class="mt-2">
        <a [href]="resetUrl" target="_blank" class="fw-bold">Click here to Reset Password Directly</a>
      </div>
    </div>
  </div>
</div>
