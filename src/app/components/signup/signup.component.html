<div class="signup-page">
  <div class="signup-container">
    <h1><i class="fas fa-user-plus me-2"></i> Sign Up</h1>

    <div *ngIf="errorMessage" class="error-message">
      <i class="fas fa-exclamation-circle me-1"></i> {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <input type="text" name="first_name" [(ngModel)]="firstName" required placeholder="First Name" />
      <input type="text" name="last_name" [(ngModel)]="lastName" required placeholder="Last Name" />
      <input type="email" name="email" [(ngModel)]="email" required placeholder="Email" />
      <input type="text" name="username" [(ngModel)]="username" required placeholder="Username" />
      <input type="password" name="password" [(ngModel)]="password" required placeholder="Password" />

      <button type="submit" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign Up</span>
        <span *ngIf="isLoading"><i class="fas fa-spinner fa-spin me-2"></i> Registering...</span>
      </button>
    </form>

    <p>Already have an account? <a routerLink="/login">Login</a></p>
    <p class="mt-2"><a routerLink="/" class="text-muted"><i class="fas fa-arrow-left me-1"></i> Back to Home</a></p>
  </div>
</div>
